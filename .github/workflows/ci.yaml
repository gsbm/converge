name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,store-backends]"

      - name: Ruff
        run: ruff check converge tests docs benchmarks

      - name: Pyright
        run: pyright

  tests-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,store-backends]"

      - name: Run core tests (excluding TCP transport suite)
        run: pytest -q --ignore=tests/unit/network/transport/test_tcp.py

  tests-network:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,store-backends]"

      - name: Run TCP/network transport tests
        run: pytest -q tests/unit/network/transport/test_tcp.py
